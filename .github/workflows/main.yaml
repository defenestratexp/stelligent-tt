---
name: lint
on:
  pull_request:
    branches:
      - master
      - main

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install markdownlint (mdl)
        run: gem install mdl

      - name: Lint Markdown
        run: mdl "$GITHUB_WORKSPACE"

  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install cfn-lint

      # Lints every CloudFormation template the course ships. Deliberately
      # incomplete starter templates are listed in .cfnlintrc as ignored.
      - name: Lint CloudFormation templates
        run: cfn-lint
