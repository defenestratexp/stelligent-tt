AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Topic 8 starter (Lab 8.1.2): an Amazon Linux 2023 instance that runs a small
  sample service writing JSON log lines, with the CloudWatch agent installed
  and reading its configuration from Parameter Store. The agent configuration
  collects metrics only; adding the logs section is your job. Connect with
  Session Manager; there is no SSH and no inbound rule.

Parameters:
  StudentId:
    Type: String
    Description: Your identifier, used in names and tags.
    AllowedPattern: "^[a-z0-9-]{2,20}$"
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC to launch into (the default VPC is fine).
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      A subnet in that VPC with a route to the internet (a default-VPC subnet
      works), so the instance can reach Systems Manager, CloudWatch and the
      AL2023 package repositories.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: AL2023 AMI, looked up from the SSM public parameter.
  InstanceType:
    Type: String
    Default: t4g.micro
    AllowedValues:
      - t4g.nano
      - t4g.micro
      - t4g.small
    Description: Graviton instance type (matches the arm64 AMI parameter).
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]
    Description: Retention for the log groups this stack creates.

Resources:
  # Create the log groups in the stack, with a retention, instead of letting
  # the agent create them. A group the agent creates never expires and is
  # left behind when you delete the stack.
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /stelligent-u/${StudentId}/lab08/app
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: owner
          Value: !Ref StudentId

  SystemLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /stelligent-u/${StudentId}/lab08/system
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: owner
          Value: !Ref StudentId

  # CloudWatchAgentServerPolicy only allows ssm:GetParameter on parameters
  # whose names start with "AmazonCloudWatch-".
  # TODO(student): add a "logs" section to this JSON (Lab 8.1.2) that sends
  # /var/log/lab08/app.log to AppLogGroup and journal entries to
  # SystemLogGroup, one stream per instance. Keep the value valid JSON.
  AgentConfig:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub AmazonCloudWatch-${StudentId}-lab08
      Type: String
      Description: CloudWatch agent configuration for Topic 8
      Value: |
        {
          "agent": {
            "metrics_collection_interval": 60
          },
          "metrics": {
            "namespace": "CWAgent",
            "append_dimensions": {
              "InstanceId": "${aws:InstanceId}"
            },
            "metrics_collected": {
              "mem": {
                "measurement": ["mem_used_percent"]
              },
              "disk": {
                "measurement": ["used_percent"],
                "resources": ["/"]
              }
            }
          }
        }
      Tags:
        owner: !Ref StudentId

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !Sub arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy
      Tags:
        - Key: owner
          Value: !Ref StudentId

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  NoInboundSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound rules. The instance only makes outbound HTTPS calls.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to Systems Manager, CloudWatch and the package repositories
      Tags:
        - Key: Name
          Value: !Sub ${StudentId}-lab08
        - Key: owner
          Value: !Ref StudentId

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: 8
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub ${StudentId}-lab08
              - Key: owner
                Value: !Ref StudentId

  AgentInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT10M
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref NoInboundSecurityGroup
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y aws-cfn-bootstrap amazon-cloudwatch-agent
          signal() {
            /opt/aws/bin/cfn-signal --exit-code "$1" --stack ${AWS::StackName} \
              --resource AgentInstance --region ${AWS::Region}
          }
          trap 'signal 1' ERR

          # The sample service: one JSON log line every 2 seconds. The
          # percentage of ERROR lines comes from /etc/lab08/error-rate.
          mkdir -p /etc/lab08 /var/log/lab08
          echo 5 > /etc/lab08/error-rate
          cat > /usr/local/bin/lab08-app <<'APP'
          #!/bin/bash
          paths=(/orders /cart /login /search)
          while true; do
            rate=$(cat /etc/lab08/error-rate 2>/dev/null || echo 5)
            path=${!paths[RANDOM % 4]}
            latency=$(( 20 + RANDOM % 200 ))
            if (( RANDOM % 100 < rate )); then
              level=ERROR; status=500; latency=$(( latency + 800 ))
            elif (( RANDOM % 100 < 10 )); then
              level=WARN; status=429
            else
              level=INFO; status=200
            fi
            printf '{"timestamp":"%s","level":"%s","path":"%s","status":%d,"latency_ms":%d}\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" "$level" "$path" "$status" "$latency" \
              >> /var/log/lab08/app.log
            sleep 2
          done
          APP
          chmod 755 /usr/local/bin/lab08-app
          cat > /etc/systemd/system/lab08-app.service <<'UNIT'
          [Unit]
          Description=Topic 8 sample service
          After=network-online.target

          [Service]
          ExecStart=/usr/local/bin/lab08-app
          Restart=always

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now lab08-app

          # Load the agent configuration from Parameter Store and start it.
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config -m ec2 -s -c ssm:${AgentConfig}

          signal 0

Outputs:
  InstanceId:
    Description: Use with aws ssm start-session --target
    Value: !Ref AgentInstance
  AgentConfigParameter:
    Description: Parameter Store name of the agent configuration
    Value: !Ref AgentConfig
  AppLogGroupName:
    Description: Log group for the sample service
    Value: !Ref AppLogGroup
  SystemLogGroupName:
    Description: Log group for journal entries
    Value: !Ref SystemLogGroup
