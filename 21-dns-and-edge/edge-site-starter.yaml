AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Topic 21 starter: a private S3 bucket that will become a CloudFront origin.
  Deploy in the lab Region (us-east-2). Lessons 21.2 and 21.4 ask you to add
  the rest; the TODO comments mark where.

Parameters:
  StudentId:
    Type: String
    Description: Your identifier, used in names and tags.
    AllowedPattern: "^[a-z0-9-]{2,20}$"
  # TODO(student): Lab 21.4.1 adds a parameter for the web ACL ARN, created in
  # us-east-1 by a separate stack. Make it optional (default "") and use a
  # Condition so the distribution can be deployed with or without it.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${StudentId}-edge-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: owner
          Value: !Ref StudentId

  # TODO(student): Lab 21.2.2 - an AWS::CloudFront::OriginAccessControl for S3
  # that always signs requests with SigV4.

  # TODO(student): Lab 21.2.2 - an AWS::CloudFront::Distribution whose only
  # origin is SiteBucket (use its regional domain name, not a website
  # endpoint) with the OAC attached. Default behavior: redirect HTTP to HTTPS,
  # GET and HEAD only, a managed cache policy (by ID). Default root object.
  # Lab 21.2.3 adds a second cache behavior; Lab 21.2.4 adds custom error
  # responses and a response headers policy; Lab 21.2.5 (real domain only)
  # adds Aliases and a certificate from us-east-1.

  # TODO(student): Lab 21.2.2 - an AWS::S3::BucketPolicy that lets the
  # CloudFront service principal read objects, only on behalf of your
  # distribution (condition on AWS:SourceArn).

Outputs:
  BucketName:
    Description: Upload the site files here.
    Value: !Ref SiteBucket
  BucketRegionalDomainName:
    Description: The S3 REST endpoint CloudFront should use as the origin.
    Value: !GetAtt SiteBucket.RegionalDomainName
  # TODO(student): output the distribution ID and its cloudfront.net domain name.
